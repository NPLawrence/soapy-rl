    "matplotlib>=3.10.7",
    "neuromancer>=1.5.6",
    "numpy>=2.2.0",
    "pandas>=2.2.3",
    "plotly>=6.4.0",
    "pyvirtualdisplay>=3.0",
    "scipy>=1.15.0",
    "seaborn>=0.13.2",
    "tensorboard>=2.20.0",
    "torch>=2.6.0",
    "torchrl>=0.10.1",
    "tyro>=0.9.35",
    "wandb>=0.21.0",
]
